services:
  - type: web
    name: hargeisa-events-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
